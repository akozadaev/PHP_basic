; Дополнительная конфигурация для CLI с уже загруженным расширением OPcache.
; php -d opcache.enable_cli=1 -d opcache.jit_buffer_size=64M -d opcache.jit=tracing examples/21-php8-features/basic.php
; При запуске с -c загрузка расширений зависит от основного php.ini.
opcache.enable_cli=1
opcache.jit_buffer_size=64M
opcache.jit=tracing
